name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:verbatim reads the CONTENT.md baseline from commit 315561c
      - uses: pnpm/action-setup@v4 # version from packageManager
      # Node comes from devEngines.runtime in package.json (pnpm downloads it).
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
